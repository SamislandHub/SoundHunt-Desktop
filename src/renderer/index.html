<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>小点声 SoundHunt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div class="drag-strip"></div>

  <div id="device">
    <div class="side-key key-vol-up"></div>
    <div class="side-key key-vol-dn"></div>
    <div class="side-key key-power"></div>
    <div class="device-frame">
      <div id="screen">

        <!-- ======= 安卓状态栏 ======= -->
        <div id="statusbar">
          <div class="sb-left">
            <span class="sb-time" id="sb-time">12:13</span>
          </div>
          <div class="sb-right">
            <svg class="ic sig" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h3v3H3zM9 14h3v7H9zM15 9h3v12h-3zM21 4h2v17h-2z" fill="currentColor"/></svg>
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.5a15 15 0 0120 0M5 12a10.5 10.5 0 0114 0M8.5 15.5a5.5 5.5 0 017 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg>
            <span class="battery"><i></i></span>
          </div>
        </div>

        <!-- ======= 页面视口 ======= -->
        <div id="viewport">

          <!-- ---------- 首页（沉浸播放流） ---------- -->
          <section class="page active" id="page-home">
            <div class="home-search" id="home-search">
              <svg class="hs-ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <span class="hs-ph">搜索歌曲、歌手</span>
              <span class="hs-btn">搜索</span>
            </div>

            <div class="home-stage" id="home-stage">
              <div class="vinyl-halo"></div>
              <canvas id="home-vinyl" width="760" height="760"></canvas>
              <button class="center-play" id="home-center-play" aria-label="播放">
                <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg>
              </button>
            </div>

            <div class="home-hint" id="home-hint">轻点播放 · 上下滑动切歌</div>

            <div class="home-meta">
              <div class="hm-text" id="hm-text" role="button" title="打开播放页">
                <div class="hm-title serif" id="hm-title">正在连接音源…</div>
                <div class="hm-artist" id="hm-artist">为你推荐加载中</div>
              </div>
              <button class="fav-btn" id="hm-fav" aria-label="收藏">
                <svg viewBox="0 0 24 24"><path d="M12 20.5S3.5 15 3.5 9.2A4.7 4.7 0 0112 6.6a4.7 4.7 0 018.5 2.6C20.5 15 12 20.5 12 20.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
              </button>
            </div>

            <!-- 首页推荐数据源（隐藏，供自动播放/换一批） -->
            <div id="feed-list" class="hidden"></div>
            <div id="feed-loading" class="hidden"></div>
          </section>

          <!-- ---------- 搜索页 ---------- -->
          <section class="page" id="page-search">
            <div class="search-head">
              <button class="sh-back" id="search-back" aria-label="返回">
                <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="search-bar">
                <svg class="search-ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <input id="search-input" placeholder="搜索歌曲、歌手" autocomplete="off">
                <button id="search-btn" aria-label="搜索">
                  <svg viewBox="0 0 24 24"><path d="M5 12h13M12 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>

            <div class="hot-chips" id="search-trend"></div>

            <div class="section-head">
              <span class="section-title" id="feed-section-title">为你推荐</span>
              <button class="refresh-feed" id="refresh-feed">
                <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 10-2.4 5.7M20 5v5h-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span id="refresh-label">换一批</span>
              </button>
            </div>
            <div class="section-status" id="feed-status">B站公开音源 · 实时更新</div>

            <div class="track-list" id="search-list"></div>
            <div class="empty-hint" id="search-empty">输入关键词开始搜索</div>
          </section>

          <!-- ---------- 收藏页 ---------- -->
          <section class="page" id="page-favorites">
            <div class="fav-head">
              <h1>我的收藏</h1>
              <span class="fav-count" id="fav-count">0 首</span>
              <button class="fav-settings" id="fav-settings" aria-label="设置">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.6v2.2M12 19.2v2.2M4.4 7l1.9 1.1M17.7 15.9l1.9 1.1M4.4 17l1.9-1.1M17.7 8.1l1.9-1.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 3.6l.6 1.9h3.8l.6-1.9M9.5 20.4l.6-1.9h3.8l.6 1.9" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
              </button>
            </div>

            <div class="fav-tools">
              <button class="pill pill-accent" id="fav-mode-random">
                <svg viewBox="0 0 24 24"><path d="M4 7h3c4 0 4 10 8 10h4M17 14l2 3-2 3M4 17h3c1.6 0 2.6-1.6 3.5-3.5M14 9.5C15 8 16 7 18 7h2M17 4l2 3-2 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>随机播放</span>
              </button>
              <button class="pill" id="fav-mode-sort">
                <svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <span>排序</span>
              </button>
              <span class="sort-label" id="fav-sort-label">按添加时间</span>
            </div>

            <div class="track-list" id="fav-list"></div>
            <div class="empty-hint" id="fav-empty">还没有收藏，去首页点 ♡ 收藏喜欢的歌</div>
          </section>

        </div><!-- /viewport -->

        <!-- ======= 迷你播放条（搜索页/收藏页显示） ======= -->
        <div id="minibar" class="hidden">
          <div class="mb-disc" id="mb-disc"><div class="mb-label" id="mb-cover"></div></div>
          <div class="mb-meta">
            <div class="mb-title" id="mb-title"></div>
            <div class="mb-artist" id="mb-artist"></div>
          </div>
          <button class="mb-play" id="mb-play" aria-label="播放/暂停">
            <svg class="mb-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            <svg class="mb-resume" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg>
          </button>
          <button class="mb-next" id="mb-next" aria-label="下一首">
            <svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zM18 6v12" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>
          <div class="mb-progress"><div class="mb-progress-fill" id="mb-progress-fill"></div></div>
        </div>

        <!-- ======= 底部导航（首页/收藏） ======= -->
        <nav id="tabbar">
          <button class="tab active" data-view="home">
            <span class="tab-ico"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 19z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.5 20.5v-6h5v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
            <span class="tab-label">首页</span>
          </button>
          <button class="tab" data-view="favorites">
            <span class="tab-ico"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
            <span class="tab-label">收藏</span>
          </button>
          <span class="tab-indicator" id="tab-indicator"></span>
        </nav>

        <div class="gesture-bar"></div>

        <!-- ======= 播放页（全屏覆盖） ======= -->
        <div id="player" class="hidden">
          <div class="player-bg" id="player-bg"></div>
          <div class="player-top">
            <button class="player-back" id="player-back" aria-label="收起">
              <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="player-top-title">
              <div class="ptt-main">正在播放</div>
              <div class="ptt-sub" id="pi-source">来自 · B站</div>
            </div>
            <button class="player-more" id="player-more" aria-label="更多">
              <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
            </button>
          </div>

          <div class="player-stage" id="player-stage">
            <div class="vinyl-halo"></div>
            <canvas id="vinyl-canvas" width="820" height="820"></canvas>
          </div>

          <div class="player-meta">
            <div class="pm-row">
              <div class="pm-text">
                <div class="pm-title serif" id="pi-title">尚未播放</div>
                <div class="pm-artist" id="pi-artist">挑一首开始听</div>
              </div>
              <button class="fav-btn" id="pl-fav" aria-label="收藏">
                <svg viewBox="0 0 24 24"><path d="M12 20.5S3.5 15 3.5 9.2A4.7 4.7 0 0112 6.6a4.7 4.7 0 018.5 2.6C20.5 15 12 20.5 12 20.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>

          <div class="player-progress">
            <input type="range" id="seek-bar" min="0" max="1000" value="0">
            <div class="progress-times"><span id="seek-cur">0:00</span><span id="seek-dur">0:00</span></div>
          </div>

          <div class="episode-row hidden" id="episode-row">
            <svg viewBox="0 0 24 24" class="ep-ico"><path d="M4 6h16M4 10h16M4 14h16M4 18h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span class="ep-name" id="episode-name">合集</span>
            <span class="ep-index serif" id="episode-index">第 1 / 1 集</span>
            <svg viewBox="0 0 24 24" class="ep-arrow"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
          </div>

          <div class="player-controls">
            <button id="pl-shuffle" class="ctl-side" aria-label="随机播放">
              <svg viewBox="0 0 24 24"><path d="M4 7h3c4 0 4 10 8 10h4M17 14l2 3-2 3M4 17h3c1.6 0 2.6-1.6 3.5-3.5M14 9.5C15 8 16 7 18 7h2M17 4l2 3-2 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="pl-prev" class="ctl-skip" aria-label="上一首">
              <svg viewBox="0 0 24 24"><path d="M17 6l-9 6 9 6z" fill="currentColor"/></svg>
            </button>
            <button id="pl-play" class="ctl-play" aria-label="播放/暂停">
              <svg class="ic-pause" viewBox="0 0 24 24"><path d="M9 6.5v11M15 6.5v11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
              <svg class="ic-resume" viewBox="0 0 24 24"><path d="M9 6l9 6-9 6z" fill="currentColor"/></svg>
            </button>
            <button id="pl-next" class="ctl-skip" aria-label="下一首">
              <svg viewBox="0 0 24 24"><path d="M7 6l9 6-9 6z" fill="currentColor"/></svg>
            </button>
            <button id="pl-repeat" class="ctl-side" aria-label="循环">
              <svg viewBox="0 0 24 24"><path d="M5 8h11l-2.5-2.5M19 16H8l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="player-bottom-space"></div>
          <div class="gesture-bar"></div>
        </div>

        <!-- ======= 音质菜单 ======= -->
        <div id="quality-menu" class="hidden">
          <div class="qm-title">音质选择</div>
          <button data-q="30216">标准 64K</button>
          <button data-q="30232">高清 132K</button>
          <button data-q="30280">无损 FLAC</button>
        </div>

        <!-- ======= 选集弹层 ======= -->
        <div id="parts-modal" class="hidden">
          <div class="parts-box">
            <div class="parts-head"><span id="parts-title">选集</span><button id="parts-close" aria-label="关闭">✕</button></div>
            <div class="parts-sub" id="parts-sub"></div>
            <div class="parts-list" id="parts-list"></div>
          </div>
        </div>

        <div id="toast"></div>
      </div><!-- /screen -->
    </div><!-- /device-frame -->
  </div><!-- /device -->
</div>
<script type="module" src="app.js"></script>
</body>
</html>
