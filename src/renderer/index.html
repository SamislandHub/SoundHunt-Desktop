<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>小点声 SoundHunt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 手机状态栏（自绘，可拖动窗口） -->
  <div id="statusbar">
    <span class="sb-time" id="sb-time">12:13</span>
    <span class="sb-brand">小点声</span>
    <div class="sb-win">
      <button class="win-btn" id="win-min" title="最小化">─</button>
      <button class="win-btn" id="win-close" title="关闭">✕</button>
    </div>
  </div>

  <!-- ============ 沉浸首页 ============ -->
  <section class="page active" id="page-home">
    <div class="home-search" id="home-search">
      <span class="hs-ico">⌕</span>
      <span class="hs-ph">搜索歌曲、歌手</span>
      <span class="hs-btn">搜索</span>
    </div>
    <div class="home-stage" id="home-stage">
      <canvas id="home-vinyl" class="home-vinyl" width="720" height="720"></canvas>
    </div>
    <div class="home-swipe" id="home-swipe">↑ 上滑切歌 · 点击唱片播放 ↓</div>
    <!-- 推荐数据容器（沉浸模式下隐藏，数据仍加载供自动播放） -->
    <div id="feed-list" class="hidden"></div>
    <div id="feed-loading" class="hidden"></div>
    <div class="home-meta">
      <div class="hm-info">
        <div class="hm-title" id="hm-title">小点声 · 沉浸音乐</div>
        <div class="hm-artist" id="hm-artist">进入即播，越听越懂你</div>
      </div>
      <button class="hm-fav" id="hm-fav" title="收藏">♡</button>
    </div>
  </section>

  <!-- ============ 搜索页 ============ -->
  <section class="page" id="page-search">
    <div class="sub-head">
      <button class="sh-back" data-back>‹</button>
      <div class="search-bar">
        <span class="search-ico">⌕</span>
        <input id="search-input" placeholder="搜索歌曲、歌手" autocomplete="off">
        <button id="search-btn">搜索</button>
      </div>
    </div>
    <div class="search-trend" id="search-trend"></div>
    <div class="track-list" id="search-list"></div>
    <div class="empty-hint" id="search-empty">输入关键词开始搜索</div>
  </section>

  <!-- ============ 收藏页 ============ -->
  <section class="page" id="page-favorites">
    <div class="fav-head">
      <div class="fav-titles"><h1>我的收藏</h1><span class="fav-count" id="fav-count">0 首</span></div>
      <div class="fav-modes">
        <button class="mode-btn active" data-mode="random">随机</button>
        <button class="mode-btn" data-mode="sequential">顺序</button>
      </div>
    </div>
    <div class="track-list" id="fav-list"></div>
    <div class="empty-hint" id="fav-empty">还没有收藏，去发现页点 ♡ 收藏喜欢的歌</div>
  </section>

  <!-- ============ 迷你播放条 ============ -->
  <div id="minibar" class="hidden">
    <div class="mb-disc" id="mb-disc"><img id="mb-cover" src="" alt=""></div>
    <div class="mb-meta"><div class="mb-title" id="mb-title"></div><div class="mb-artist" id="mb-artist"></div></div>
    <button class="mb-play" id="mb-play" title="播放/暂停">▶</button>
    <button class="mb-next" id="mb-next" title="下一首">⏭</button>
    <div class="mb-progress" id="mb-progress"><div class="mb-progress-fill" id="mb-progress-fill"></div></div>
  </div>

  <!-- ============ 底部导航 ============ -->
  <nav id="tabbar">
    <button class="tab active" data-view="home"><span class="tab-ico">⌂</span><span>首页</span></button>
    <button class="tab" data-view="search"><span class="tab-ico">⌕</span><span>搜索</span></button>
    <button class="tab" data-view="favorites"><span class="tab-ico">☰</span><span>收藏</span></button>
  </nav>

  <!-- ============ 播放页（全屏覆盖） ============ -->
  <div id="player" class="hidden">
    <div class="player-bg" id="player-bg"></div>
    <div class="player-top">
      <button class="player-back" id="player-back" title="收起">‹</button>
      <div class="player-top-title">
        <div class="ptt-main">正在播放</div>
        <div class="ptt-sub" id="pi-source">来自 · B站</div>
      </div>
      <button class="player-more" id="player-more" title="音质 / 选集">···</button>
    </div>
    <div class="player-disc" id="player-disc">
      <canvas id="vinyl-canvas" width="720" height="720"></canvas>
    </div>
    <div class="player-info">
      <div class="pi-row">
        <div class="pi-text">
          <div class="pi-title" id="pi-title"></div>
          <div class="pi-artist" id="pi-artist"></div>
        </div>
        <button class="pi-fav" id="pl-fav" title="收藏">♡</button>
      </div>
      <div class="player-seek">
        <span id="seek-cur">0:00</span>
        <input type="range" id="seek-bar" min="0" max="1000" value="0">
        <span id="seek-dur">0:00</span>
      </div>
      <div class="player-controls">
        <button id="pl-mode" title="循环模式">🔀</button>
        <button id="pl-prev" title="上一首">⏮</button>
        <button id="pl-play" class="pl-play" title="播放/暂停">▶</button>
        <button id="pl-next" title="下一首">⏭</button>
        <button id="pl-list" title="选集">☰</button>
      </div>
    </div>
  </div>

  <!-- 音质菜单 -->
  <div id="quality-menu" class="hidden">
    <div class="qm-title">音质选择</div>
    <button data-q="30216">标准 64K</button>
    <button data-q="30232">高清 132K</button>
    <button data-q="30280">无损 FLAC</button>
  </div>

  <!-- 选集弹层 -->
  <div id="parts-modal" class="hidden">
    <div class="parts-box">
      <div class="parts-head"><span>选集</span><button id="parts-close">✕</button></div>
      <div class="parts-list" id="parts-list"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
