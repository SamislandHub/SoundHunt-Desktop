<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>小点声 SoundHunt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 自绘标题栏 -->
  <div id="titlebar">
    <div class="tb-brand"><span class="tb-logo"></span>小点声 <small>SOUNDHUNT</small></div>
    <div class="tb-tabs">
      <button class="tb-tab active" data-view="home">发现</button>
      <button class="tb-tab" data-view="search">搜索</button>
      <button class="tb-tab" data-view="favorites">收藏</button>
    </div>
    <div class="tb-actions">
      <button id="btn-theme" title="切换主题">◐</button>
      <button class="win-btn" id="win-min" title="最小化">─</button>
      <button class="win-btn" id="win-max" title="最大化">□</button>
      <button class="win-btn close" id="win-close" title="关闭">✕</button>
    </div>
  </div>

  <div id="main">
    <!-- 发现页 -->
    <section class="view active" id="view-home">
      <div class="feed-scroll" id="feed-scroll">
        <div class="feed-head">
          <h1>听见好音乐</h1>
          <p>打开即播 · 上滑下滑切歌 · 越听越懂你</p>
          <div class="feed-chips" id="feed-chips"></div>
        </div>
        <div class="track-list" id="feed-list"></div>
        <div class="feed-loading" id="feed-loading" style="display:none"><span class="spinner"></span>正在发现更多好歌…</div>
      </div>
    </section>

    <!-- 搜索页 -->
    <section class="view" id="view-search">
      <div class="search-wrap">
        <div class="search-bar">
          <span class="search-ico">⌕</span>
          <input id="search-input" placeholder="搜索歌曲、歌手、关键词…" autocomplete="off">
          <button id="search-btn">搜索</button>
        </div>
        <div class="search-trend" id="search-trend"></div>
        <div class="track-list" id="search-list"></div>
        <div class="empty-hint" id="search-empty">输入关键词开始搜索</div>
      </div>
    </section>

    <!-- 收藏页 -->
    <section class="view" id="view-favorites">
      <div class="fav-wrap">
        <div class="fav-head">
          <div><h1>我的收藏</h1><p id="fav-count">0 首</p></div>
          <div class="fav-modes">
            <button class="mode-btn active" data-mode="random">随机</button>
            <button class="mode-btn" data-mode="sequential">顺序</button>
          </div>
        </div>
        <div class="track-list" id="fav-list"></div>
        <div class="empty-hint" id="fav-empty">还没有收藏，去发现页点 ♡ 收藏喜欢的歌</div>
      </div>
    </section>
  </div>

  <!-- 迷你播放条 -->
  <div id="minibar" class="hidden">
    <div class="mb-disc" id="mb-disc"><img id="mb-cover" src="" alt=""></div>
    <div class="mb-meta"><div class="mb-title" id="mb-title"></div><div class="mb-artist" id="mb-artist"></div></div>
    <div class="mb-controls">
      <button id="mb-prev" title="上一首">⏮</button>
      <button id="mb-play" class="mb-play" title="播放/暂停">▶</button>
      <button id="mb-next" title="下一首">⏭</button>
    </div>
    <div class="mb-progress" id="mb-progress"><div class="mb-progress-fill" id="mb-progress-fill"></div></div>
    <button class="mb-quality" id="mb-quality" title="音质">高清132K</button>
    <button class="mb-expand" id="mb-expand" title="播放页">⌃</button>
  </div>

  <!-- 播放页（全屏覆盖层） -->
  <div id="player" class="hidden">
    <canvas id="wave-canvas"></canvas>
    <div class="player-bg" id="player-bg"></div>
    <button class="player-close" id="player-close" title="收起">⌄</button>
    <div class="player-center">
      <div class="vinyl-wrap" id="vinyl-wrap">
        <canvas id="vinyl-canvas" width="520" height="520"></canvas>
        <div class="vinyl-spindle"></div>
      </div>
      <div class="player-info">
        <div class="pi-source" id="pi-source">B站 · 正在播放</div>
        <div class="pi-title" id="pi-title"></div>
        <div class="pi-artist" id="pi-artist"></div>
        <div class="pi-collection" id="pi-collection" style="display:none">选集 ▸</div>
      </div>
      <div class="player-seek">
        <span id="seek-cur">0:00</span>
        <input type="range" id="seek-bar" min="0" max="1000" value="0">
        <span id="seek-dur">0:00</span>
      </div>
      <div class="player-controls">
        <button id="pl-mode" title="播放模式">🔀</button>
        <button id="pl-prev" title="上一首">⏮</button>
        <button id="pl-play" class="pl-play" title="播放/暂停">▶</button>
        <button id="pl-next" title="下一首">⏭</button>
        <button id="pl-fav" title="收藏">♡</button>
      </div>
      <div class="player-quality" id="player-quality">高清 132K</div>
    </div>
    <div class="player-hint" id="player-hint">↑ ↓ 切歌 · 空格 播放/暂停 · Esc 收起</div>
  </div>

  <!-- 音质菜单 -->
  <div id="quality-menu" class="hidden">
    <div class="qm-title">音质选择</div>
    <button data-q="30216">标准 64K</button>
    <button data-q="30232">高清 132K</button>
    <button data-q="30280">无损 FLAC</button>
  </div>

  <!-- 选集弹层 -->
  <div id="parts-modal" class="hidden">
    <div class="parts-box">
      <div class="parts-head"><span>选集</span><button id="parts-close">✕</button></div>
      <div class="parts-list" id="parts-list"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
